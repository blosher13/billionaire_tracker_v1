# Kafka Connect worker (distributed mode, one worker). REST API on :8083.
bootstrap.servers=localhost:9092
listeners=http://localhost:8083
group.id=billiontracker-connect

# Our record keys are plain strings (the aircraft hex); values are Avro via Schema Registry.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://localhost:8081

# Connect stores connector configs, source offsets and status in these Kafka topics.
config.storage.topic=connect-configs
offset.storage.topic=connect-offsets
status.storage.topic=connect-statuses
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1

# Lets connector configs reference secrets as ${file:<path>:<key>} instead of embedding them.
# Here: the Postgres password in the project's .env (only files under the project are allowed).
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
config.providers.file.param.allowed.paths=__PROJECT_ROOT__

# Confluent's bundled plugins + the JDBC connector we installed into connect/plugins.
plugin.path=__CONFLUENT_HOME__/share/java,__PROJECT_ROOT__/connect/plugins
