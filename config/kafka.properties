# Single-node KRaft: this one process is both the broker and the controller (no ZooKeeper).
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=localhost:9093
controller.listener.names=CONTROLLER

# 9092 = clients (producer, streams, connect). 9093 = internal controller traffic.
listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
advertised.listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

# Replaced by scripts/start-kafka.sh with <project>/.kafka-data so data survives reboots.
log.dirs=/tmp/kraft-combined-logs

num.partitions=1
num.network.threads=3
num.io.threads=8

# Only one broker, so every internal topic can only have 1 replica.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

# Confluent Server (the "-ce" build) creates its own internal topics (license, metadata,
# self-balancing, audit log) with replication factor 3 by default. On one broker that fails
# and the broker shuts itself down ("Failed to start license store"), so force them to 1.
confluent.license.topic.replication.factor=1
confluent.metadata.topic.replication.factor=1
confluent.balancer.topic.replication.factor=1
confluent.security.event.logger.exporter.kafka.topic.replicas=1
confluent.topic.replication.factor=1
# Don't send usage telemetry to Confluent (it also tries to create an RF=3 topic).
confluent.telemetry.enabled=false

log.retention.hours=168
